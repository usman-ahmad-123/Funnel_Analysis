<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Funnel Analysis Predictor</title>
    <style>
        body { font-family: Arial; background-color: #f4f4f4; text-align: center; }
        form { background: white; padding: 20px; margin: 50px auto; width: 300px; border-radius: 8px; }
        input, select { width: 90%; padding: 8px; margin: 10px 0; }
        button { background-color: #0078D7; color: white; padding: 10px 20px; border: none; border-radius: 5px; }
    </style>
</head>
<body>
    <h2>🔍 Funnel Conversion Predictor</h2>
    <form action="/predict" method="post">
        <label>Channel:</label>
        <select name="channel">
            <option>Organic</option>
            <option>Email</option>
            <option>Google Ads</option>
            <option>Social Media</option>
        </select>

        <label>Region:</label>
        <select name="region">
            <option>North</option>
            <option>South</option>
            <option>East</option>
            <option>West</option>
        </select>

        <label>Device:</label>
        <select name="device">
            <option>Desktop</option>
            <option>Mobile</option>
            <option>Tablet</option>
        </select>

        <label>Sessions:</label>
        <input type="number" name="sessions" step="1" required>

        <button type="submit">Predict</button>
    </form>

    {% if prediction_text %}
        <h3>{{ prediction_text }}</h3>
    {% endif %}
</body>
</html>
