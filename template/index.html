<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customer Churn Prediction Dashboard</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to right, #0072ff, #00c6ff);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    h1 {
      margin-bottom: 20px;
    }
    .btn {
      background-color: #fff;
      color: #0072ff;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      text-decoration: none;
      transition: 0.3s;
    }
    .btn:hover {
      background-color: #0072ff;
      color: #fff;
    }
    .info {
      margin-top: 20px;
      max-width: 600px;
      font-size: 1.1em;
    }
  </style>
</head>
<body>
  <h1>📊 Customer Churn Prediction Dashboard</h1>
  <p class="info">
    Welcome to the interactive churn prediction app powered by
    <strong>Logistic Regression, Random Forest, and XGBoost</strong>.
    Explore predictions, SHAP explanations, and business insights.
  </p>
  <a href="https://customer-churn-prediction-lr-rf.streamlit.app" class="btn">
    🚀 Launch Dashboard
  </a>
</body>
</html>
